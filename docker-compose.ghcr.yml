# Kør færdigbygget image fra GitHub Container Registry (GHCR).
# Opret .env ud fra .env.example og sæt GHCR_IMAGE til dit repo.

services:
  borgerliste:
    image: ${GHCR_IMAGE:?Set GHCR_IMAGE in .env}
    container_name: borgerliste-app
    ports:
      - "8501:8501"
    environment:
      BORGERLISTE_DATA_DIR: /data
      BORGERLISTE_MASTER_DELETE_PASSWORD: ${BORGERLISTE_MASTER_DELETE_PASSWORD:-Linkin24}
    volumes:
      - borgerliste_data:/data
    restart: unless-stopped

volumes:
  borgerliste_data:
